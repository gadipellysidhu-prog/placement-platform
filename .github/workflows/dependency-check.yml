name: Dependency Security Audit (OWASP)

on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — off-peak to avoid NVD rate limits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Cache the NVD CVE database so weekly runs skip the ~300 MB download.
      # The OWASP dependency-check Maven plugin stores its H2 database under
      # ~/.dependency-check/data (not ~/.gradle — this project uses Maven).
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-

      - name: OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "$NVD_API_KEY" ]; then
            EXTRA="-DnvdApiKey=$NVD_API_KEY"
          fi
          # Fails build on CVSS >= 7 (HIGH+CRITICAL). Test-scope deps excluded.
          mvn org.owasp:dependency-check-maven:10.0.4:check \
            -DfailBuildOnCVSS=7 \
            -Dformat=HTML,XML \
            -DskipTestScope=true \
            -DnvdApiDelay=6000 \
            $EXTRA \
            -B

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_number }}
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.xml
          retention-days: 30
          if-no-files-found: ignore
