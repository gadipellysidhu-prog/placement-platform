name: Dependency Security Audit (OWASP)

on:
  push:
    branches: [main]
  schedule:
    # Weekly Monday 06:00 UTC — off-peak to avoid NVD rate limits
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  # Single source of truth for the plugin version, reused below in the cache
  # key and the goal invocation so a version bump always busts the NVD cache.
  DC_VERSION: 12.2.2

jobs:
  owasp-dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Cache the NVD CVE database so subsequent runs only fetch the incremental
      # delta instead of re-downloading the full ~300 MB dataset. The plugin's
      # dataDirectory is pinned to this exact path in the step below so the cache
      # captures the DB the Maven plugin actually uses — its default lives inside
      # the local Maven repo, which is why the old ~/.dependency-check/data cache
      # never hit. The run_id key always writes a fresh entry; restore-keys pulls
      # the newest prior cache so the DB carries forward run-to-run. The key is
      # scoped by DC_VERSION because the plugin's H2 schema is not always
      # forward/backward compatible across versions (e.g. 10.0.4 -> 12.2.2 hit
      # "Incompatible or corrupt database found", which failOnError=false
      # swallowed as a silent false-green instead of a build failure) — scoping
      # the key means a plugin version bump always starts from a clean DB.
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check/data
          key: owasp-nvd-${{ runner.os }}-${{ env.DC_VERSION }}-${{ github.run_id }}
          restore-keys: |
            owasp-nvd-${{ runner.os }}-${{ env.DC_VERSION }}-

      - name: OWASP Dependency Check
        working-directory: backend
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: |
          set -euo pipefail
          # Pin the NVD data directory to the cached path (see cache step above).
          DATA_DIR="$HOME/.dependency-check/data"
          mkdir -p "$DATA_DIR"

          ARGS=(
            org.owasp:dependency-check-maven:${{ env.DC_VERSION }}:check
            -DfailBuildOnCVSS=7          # fail on HIGH+CRITICAL (real vulnerabilities)
            -Dformat=HTML,XML
            -DskipTestScope=true
            "-DdataDirectory=$DATA_DIR"
            -B
          )

          if [ -n "${NVD_API_KEY:-}" ]; then
            echo "NVD API key detected — using authenticated NVD API access (fast)."
            # GitHub automatically masks the secret value in log output.
            ARGS+=("-DnvdApiKey=$NVD_API_KEY")
          else
            echo "::warning::NVD_API_KEY secret is not set — falling back to the slow, rate-limited anonymous NVD download. Add the NVD_API_KEY repository secret under Settings → Secrets and variables → Actions."
            ARGS+=("-DnvdApiDelay=6000")   # throttle is only needed for anonymous access
          fi

          # Suppressions (owasp-suppressions.xml), OSS Index disablement and
          # failOnError come from the dependency-check plugin <configuration> in
          # backend/pom.xml, so false positives stay handled and genuine
          # vulnerabilities (CVSS >= 7) still fail the build.
          mvn "${ARGS[@]}"

      - name: Upload OWASP report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: owasp-report-${{ github.run_number }}
          path: |
            backend/target/dependency-check-report.html
            backend/target/dependency-check-report.xml
          retention-days: 30
          if-no-files-found: ignore
