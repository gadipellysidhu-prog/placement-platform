# ─────────────────────────────────────────────────────────────────────────────
# Nginx 1.25 — Production Reverse Proxy for Placement Platform
#
# Responsibilities:
#   - Reverse proxy to Spring Boot backend on :8081
#   - TLS termination (certificates mounted at /etc/nginx/certs/)
#   - Gzip compression for API payloads
#   - Security headers (CSP, HSTS, X-Frame-Options, etc.)
#   - Per-IP rate limiting on auth endpoints
#   - Request body size cap (JSON APIs, not file upload path)
# ─────────────────────────────────────────────────────────────────────────────

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────────
    log_format json_combined escape=json
        '{'
            '"time":"$time_iso8601",'
            '"remote_addr":"$remote_addr",'
            '"method":"$request_method",'
            '"uri":"$request_uri",'
            '"status":$status,'
            '"bytes_sent":$bytes_sent,'
            '"request_time":$request_time,'
            '"upstream_time":"$upstream_response_time",'
            '"http_referrer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    access_log /var/log/nginx/access.log json_combined;

    # ── Core performance settings ─────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Request size cap ─────────────────────────────────────────────────────
    # File uploads bypass nginx and should go directly to app or use a separate
    # upload endpoint with its own limit. Default JSON payloads cap at 2 MB.
    client_max_body_size  12m;
    client_body_timeout   15s;
    client_header_timeout 15s;
    send_timeout          15s;

    # ── Gzip compression ─────────────────────────────────────────────────────
    gzip               on;
    gzip_vary          on;
    gzip_proxied       any;
    gzip_comp_level    5;
    gzip_buffers       16 8k;
    gzip_http_version  1.1;
    gzip_min_length    256;
    gzip_types
        application/json
        application/problem+json
        application/xml
        text/plain
        text/xml
        text/css
        application/javascript
        image/svg+xml;

    # ── Rate limiting zones ───────────────────────────────────────────────────
    # Auth endpoints: 10 req/min per IP (extra protection on top of Bucket4j)
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=10r/m;
    # General API: 300 req/min per IP
    limit_req_zone $binary_remote_addr zone=api_zone:10m  rate=300r/m;

    limit_req_status 429;

    # ── Upstream ─────────────────────────────────────────────────────────────
    upstream placement_backend {
        server app:8081;
        keepalive 32;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        # Allow ACME challenge for Let's Encrypt cert renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS server ──────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        # TLS certificates — mount real certs at these paths in production
        ssl_certificate      /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key  /etc/nginx/certs/privkey.pem;

        # Modern TLS configuration (Mozilla "Intermediate" profile)
        ssl_protocols              TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers  off;
        ssl_ciphers                ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_session_timeout        1d;
        ssl_session_cache          shared:SSL:10m;
        ssl_session_tickets        off;
        ssl_stapling               on;
        ssl_stapling_verify        on;

        # ── Security headers ─────────────────────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options           "DENY" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Content-Security-Policy   "default-src 'self'; frame-ancestors 'none'; object-src 'none'" always;
        # server_tokens off (set in http block) suppresses the nginx version from the Server header.

        # ── Auth endpoints — tighter rate limiting ────────────────────────────
        location ~ ^/auth/(login|register|refresh|forgot-password) {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_log_level warn;

            proxy_pass         http://placement_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout 5s;
            proxy_send_timeout    15s;
            proxy_read_timeout    15s;
        }

        # ── Actuator health (public, no rate limit, no auth header forwarding)
        location = /actuator/health {
            proxy_pass         http://placement_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection "";
            proxy_set_header   Host      $host;
            access_log off;
        }

        # ── Actuator (admin-only, no external exposure needed in prod)
        # Remove this block to block actuator entirely from external access
        location /actuator/ {
            # Allow only from internal networks or trusted IPs
            allow 10.0.0.0/8;
            allow 172.16.0.0/12;
            allow 127.0.0.1;
            deny  all;

            proxy_pass         http://placement_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection      "";
            proxy_set_header   Host            $host;
            proxy_set_header   X-Real-IP       $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ── General API ───────────────────────────────────────────────────────
        location / {
            limit_req zone=api_zone burst=50 nodelay;

            proxy_pass         http://placement_backend;
            proxy_http_version 1.1;
            proxy_set_header   Connection        "";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;

            proxy_connect_timeout  5s;
            proxy_send_timeout    60s;
            proxy_read_timeout    60s;
            proxy_buffering       on;
            proxy_buffer_size     4k;
            proxy_buffers         8 4k;
        }
    }
}
