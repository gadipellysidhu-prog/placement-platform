# Production Docker Compose Stack
# ─────────────────────────────────────────────────────────────────────────────
# Usage:
#   .\scripts\generate-prod-keys.ps1          # generate RSA keys into .env.prod
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Startup order: postgres (healthy) → app (Flyway + Hibernate) → nginx
# Stack validates:
#   docker compose -f docker-compose.prod.yml ps
#   curl -sf https://localhost/actuator/health | jq .
#   curl -sf http://localhost/actuator/health | jq .     # follows → 301 → HTTPS
#
# TLS certificates:
#   Place fullchain.pem and privkey.pem in ./nginx/certs/
#   For Let's Encrypt: run certbot, copy certs to ./nginx/certs/, reload nginx.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: placement-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-placement_prod}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - placement_prod_pgdata:/var/lib/postgresql/data
    networks:
      - placement-prod-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-placement_user} -d ${DB_NAME:-placement_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
        reservations:
          memory: 256M

  # ── Spring Boot Application ────────────────────────────────────────────────
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: placement-platform:${APP_VERSION:-1.0.0}
    container_name: placement-prod-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-placement_prod}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SERVER_PORT: ${SERVER_PORT:-8081}
      JWT_PRIVATE_KEY_PEM: ${JWT_PRIVATE_KEY_PEM}
      JWT_PUBLIC_KEY_PEM: ${JWT_PUBLIC_KEY_PEM}
      JWT_ACCESS_EXPIRY_MS: ${JWT_ACCESS_EXPIRY_MS:-900000}
      JWT_REFRESH_EXPIRY_MS: ${JWT_REFRESH_EXPIRY_MS:-604800000}
      JWT_ISSUER: ${JWT_ISSUER:-placement-platform}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-placement-api}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      FILE_UPLOAD_DIR: /app/uploads
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-10485760}
      FILE_MAX_MULTIPART_SIZE: ${FILE_MAX_MULTIPART_SIZE:-10MB}
      FILE_SCAN_ENABLED: ${FILE_SCAN_ENABLED:-false}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
    volumes:
      - placement_prod_uploads:/app/uploads
    # No external port exposure — nginx is the only ingress point
    expose:
      - "${SERVER_PORT:-8081}"
    networks:
      - placement-prod-network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --tries=1 --spider http://localhost:${SERVER_PORT:-8081}/actuator/health/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
        reservations:
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
        tag: "placement-platform"

  # ── Nginx Reverse Proxy ───────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: placement-prod-nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - nginx_logs:/var/log/nginx
      # ACME challenge directory for Let's Encrypt renewal
      - certbot_webroot:/var/www/certbot:ro
    networks:
      - placement-prod-network
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 80 && nc -z 127.0.0.1 443"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"
        reservations:
          memory: 64M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
        tag: "placement-nginx"

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  placement-prod-network:
    driver: bridge
    name: placement-prod-network

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  placement_prod_pgdata:
    name: placement_prod_pgdata
    driver: local
  placement_prod_uploads:
    name: placement_prod_uploads
    driver: local
  nginx_logs:
    name: placement_prod_nginx_logs
    driver: local
  certbot_webroot:
    name: placement_prod_certbot_webroot
    driver: local
