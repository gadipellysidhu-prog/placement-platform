# Local development infrastructure (MOP 5.3 / 7.5).
# Start with: docker compose -f docker-compose.dev.yml up -d
# Status: docker compose -f docker-compose.dev.yml ps
# Stop: docker compose -f docker-compose.dev.yml down

services:
  postgres:
    image: postgres:16
    container_name: placement-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: placement_dev
      POSTGRES_USER: placement_user
      POSTGRES_PASSWORD: dev_password_123
    ports:
      - "5432:5432"
    volumes:
      - placement_platform_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U placement_user -d placement_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: placement-platform-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  clamav:
    image: clamav/clamav:stable
    container_name: placement-platform-clamav
    ports:
      - "3310:3310"
    healthcheck:
      test: ["CMD-SHELL", "echo PING | nc -w 5 localhost 3310 | grep -q PONG"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s

volumes:
  placement_platform_pgdata:

