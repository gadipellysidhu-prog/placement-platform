spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# In development, /actuator/health shows full component details (db, diskSpace, ...).
management:
  endpoint:
    health:
      show-details: always
      show-components: always

file:
  pipeline:
    upload-dir: ./uploads-dev
    clam-av-host: ${CLAMAV_HOST:localhost}
    clam-av-port: ${CLAMAV_PORT:3310}
    scan-enabled: true

security:
  rate-limit:
    enabled: true
    login-capacity: 5
    register-capacity: 3
    refresh-capacity: 20
    general-capacity: 100
  lockout:
    max-failures: 5
    lock-duration-minutes: 15
  headers:
    hsts-enabled: false

logging:
  level:
    com.college.placement: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
