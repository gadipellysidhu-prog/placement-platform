spring:
  # Connection details default to the local docker-compose.dev.yml stack, but can
  # be overridden by environment variables (.env). No real secrets live in source.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: true

# In development, /actuator/health shows full component details (db, diskSpace, ...).
management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.college.placement: DEBUG
    org.flywaydb: INFO
    org.hibernate.SQL: DEBUG
