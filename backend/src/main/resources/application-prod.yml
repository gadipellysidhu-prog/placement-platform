spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PlacementHikariPool

  jpa:
    show-sql: false
    open-in-view: false

  flyway:
    baseline-on-migrate: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        # Expose only what operations needs; never expose env/configprops/beans in prod
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      # Kubernetes / Docker health probe groups
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
          show-details: never
          show-components: never
        readiness:
          include: readinessState,db,diskSpace
          show-details: never
          show-components: never
    env:
      show-values: never
    configprops:
      show-values: never
  metrics:
    enable:
      hikaricp: true
    tags:
      application: placement-platform
      environment: prod

security:
  rate-limit:
    enabled: true
    login-capacity: 5
    register-capacity: 3
    refresh-capacity: 20
    general-capacity: 100
  lockout:
    max-failures: 5
    lock-duration-minutes: 15
  headers:
    hsts-enabled: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

logging:
  level:
    root: WARN
    com.college.placement: INFO
    org.flywaydb: INFO
