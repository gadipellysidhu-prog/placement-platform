spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    show-sql: false
    open-in-view: false

  flyway:
    baseline-on-migrate: false

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.college.placement: INFO
    org.flywaydb: INFO
