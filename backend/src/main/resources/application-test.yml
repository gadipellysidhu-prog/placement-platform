spring:
  datasource:
    url: jdbc:h2:mem:placement_test
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  # Disable Flyway for H2 testing - use Hibernate DDL instead
  flyway:
    enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

file:
  pipeline:
    upload-dir: ./target/test-uploads
    max-size-bytes: 10485760
    allowed-mime-types:
      - application/pdf
      - image/png
      - image/jpeg
    clam-av-host: localhost
    clam-av-port: 3310
    clam-av-timeout-ms: 5000
    scan-enabled: false

app:
  outbox:
    initial-delay: 3600000  # 1 hour — prevents auto-firing during tests
    fixed-delay: 3600000
    batch-size: 10
    max-retries: 3
    retry-backoff-minutes: 1,5,15

logging:
  level:
    com.college.placement: DEBUG
    org.hibernate.SQL: DEBUG
