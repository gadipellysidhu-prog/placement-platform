spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  # Flyway runs all migrations under db/migration on startup.
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false

server:
  port: ${SERVER_PORT:8081}

# Actuator: expose health/info/metrics. Health details hidden by default.
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: Placement Intelligence & Skill Verification Platform
    version: 1.0.0
