spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_MULTIPART_SIZE:10MB}
      max-request-size: ${FILE_MAX_MULTIPART_SIZE:10MB}

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,env,configprops
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    env:
      show-values: never
    configprops:
      show-values: never
  metrics:
    tags:
      application: placement-platform

info:
  app:
    name: Placement Intelligence & Skill Verification Platform
    version: 1.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:}

file:
  pipeline:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
    allowed-mime-types:
      - application/pdf
      - image/png
      - image/jpeg
    clam-av-host: ${CLAMAV_HOST:localhost}
    clam-av-port: ${CLAMAV_PORT:3310}
    clam-av-timeout-ms: ${CLAMAV_TIMEOUT_MS:30000}
    scan-enabled: ${FILE_SCAN_ENABLED:true}

app:
  outbox:
    batch-size: 10
    fixed-delay: 5000
    initial-delay: 5000
    max-retries: 5
    retry-backoff-minutes: 1,5,15,30,60

logging:
  level:
    com.college.placement: INFO
    org.flywaydb: INFO
