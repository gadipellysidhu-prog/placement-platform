spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

info:
  app:
    name: Placement Intelligence & Skill Verification Platform
    version: 1.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:}

logging:
  level:
    com.college.placement: INFO
    org.flywaydb: INFO
