spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/placement_dev}
    username: ${DB_USERNAME:placement_user}
    password: ${DB_PASSWORD:dev_password_123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: PlacementHikariPool

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
          fetch_size: 50
        order_inserts: true
        order_updates: true
        generate_statistics: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
    out-of-order: false

  servlet:
    multipart:
      max-file-size: ${FILE_MAX_MULTIPART_SIZE:10MB}
      max-request-size: ${FILE_MAX_MULTIPART_SIZE:10MB}

  lifecycle:
    timeout-per-shutdown-phase: 30s

  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS:false}

# Notification email delivery. Disabled by default so environments without an
# SMTP relay (tests, bare dev) run cleanly; enabled in dev (MailHog) and prod.
notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:no-reply@placement.local}

server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful

management:
  health:
    # Mail connectivity must not gate application readiness — email is a
    # best-effort side channel dispatched asynchronously via the outbox.
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    env:
      show-values: never
    configprops:
      show-values: never
  metrics:
    tags:
      application: placement-platform

info:
  app:
    name: Placement Intelligence & Skill Verification Platform
    version: 1.0.0

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

jwt:
  access-token-expiry-ms: ${JWT_ACCESS_EXPIRY_MS:900000}
  refresh-token-expiry-ms: ${JWT_REFRESH_EXPIRY_MS:604800000}
  private-key-pem: ${JWT_PRIVATE_KEY_PEM:}
  public-key-pem: ${JWT_PUBLIC_KEY_PEM:}
  issuer: ${JWT_ISSUER:placement-platform}
  audience: ${JWT_AUDIENCE:placement-api}

security:
  rate-limit:
    enabled: true
    login-capacity: 5
    register-capacity: 3
    refresh-capacity: 20
    general-capacity: 100
  lockout:
    max-failures: 5
    lock-duration-minutes: 15
  headers:
    hsts-enabled: false

file:
  pipeline:
    upload-dir: ${FILE_UPLOAD_DIR:./uploads}
    max-size-bytes: ${FILE_MAX_SIZE_BYTES:10485760}
    allowed-mime-types:
      - application/pdf
      - image/png
      - image/jpeg
    clam-av-host: ${CLAMAV_HOST:localhost}
    clam-av-port: ${CLAMAV_PORT:3310}
    clam-av-timeout-ms: ${CLAMAV_TIMEOUT_MS:30000}
    scan-enabled: ${FILE_SCAN_ENABLED:true}

# Pluggable file-storage backend. provider=local (default; on-disk via
# file.pipeline.upload-dir) | s3 (also MinIO / S3-compatible via endpoint +
# path-style-access). Switching providers requires no code change.
storage:
  provider: ${STORAGE_PROVIDER:local}
  signed-url-ttl-seconds: ${STORAGE_SIGNED_URL_TTL_SECONDS:900}
  s3:
    bucket: ${STORAGE_S3_BUCKET:}
    region: ${STORAGE_S3_REGION:us-east-1}
    endpoint: ${STORAGE_S3_ENDPOINT:}
    path-style-access: ${STORAGE_S3_PATH_STYLE:true}
    access-key: ${STORAGE_S3_ACCESS_KEY:}
    secret-key: ${STORAGE_S3_SECRET_KEY:}

app:
  outbox:
    batch-size: 10
    fixed-delay: 5000
    initial-delay: 5000
    max-retries: 5
    retry-backoff-minutes: 1,5,15,30,60

logging:
  level:
    com.college.placement: INFO
    org.flywaydb: INFO
