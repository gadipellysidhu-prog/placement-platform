global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: placement-platform
    environment: local

scrape_configs:
  - job_name: placement-platform
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - localhost:8081
    scrape_interval: 10s
    scrape_timeout: 8s
